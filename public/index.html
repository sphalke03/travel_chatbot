<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Enquiry Assistant</title>
<style>
  :root { --bg:#f5f7fa; --card:#ffffff; --text:#1a1a1a; --user:#0b6bcb; --bot:#e9eef5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1b2026; --text:#eeeeee; --bot:#2a313a; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center; }
  .chat { width:100%; max-width:560px; height:100%; display:flex; flex-direction:column; background:var(--card); }
  header { padding:14px 16px; font-weight:600; border-bottom:1px solid #8884; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:16px; line-height:1.4; white-space:pre-wrap; }
  .bot { background:var(--bot); align-self:flex-start; }
  .user { background:var(--user); color:#fff; align-self:flex-end; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid #8884; }
  input { flex:1; padding:12px; border-radius:12px; border:1px solid #8886; font-size:16px; background:transparent; color:inherit; }
  button { padding:0 18px; border:0; border-radius:12px; background:var(--user); color:#fff; font-size:16px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
</style>
</head>
<body>
<div class="chat">
  <header>Sunrise Travels Assistant</header>
  <div id="log"></div>
  <form id="f">
    <input id="q" placeholder="Ask about packages, visas, prices..." autocomplete="off" required>
    <button id="b" type="submit">Send</button>
  </form>
</div>
<script>
  var log = document.getElementById("log");
  var f = document.getElementById("f");
  var q = document.getElementById("q");
  var b = document.getElementById("b");
  var messages = [];

  function add(role, text) {
    var d = document.createElement("div");
    d.className = "msg " + (role === "user" ? "user" : "bot");
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  add("assistant", "Hi! Ask me about our packages, prices, visas, booking or cancellation policy.");

  f.addEventListener("submit", async function (e) {
    e.preventDefault();
    var text = q.value.trim();
    if (!text) return;
    q.value = "";
    b.disabled = true;
    messages.push({ role: "user", content: text });
    add("user", text);
    var typing = add("assistant", "...");
    try {
      var r = await fetch("/api/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ messages: messages })
      });
      var data = await r.json();
      typing.textContent = data.reply;
      messages.push({ role: "assistant", content: data.reply });
    } catch (err) {
      typing.textContent = "Network error. Please try again.";
    }
    b.disabled = false;
    q.focus();
  });
</script>
</body>
</html>
